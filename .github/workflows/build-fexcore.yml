name: Build FEXCore (Winlator - Helio G99)

on:
  workflow_dispatch:

env:
  OUTPUT_DIR: 'fex-output'

jobs:
  build-fexcore:
    name: FEXCore 2507 (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Setup gh + git auth
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gh
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build pkgconf ccache \
            clang-17 llvm-17 lld-17 zstd \
            libssl-dev python3-setuptools libclang-17-dev \
            libcurl4-openssl-dev libgl-dev libglx-dev libegl-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev \
            libc6-dev libgcc-14-dev libstdc++-14-dev

      - name: Clone FEX
        run: |
          git clone --recurse-submodules --branch FEX-2507 \
            --depth 1 https://github.com/FEX-Emu/FEX.git fex || \
          git clone --recurse-submodules --depth 1 \
            https://github.com/FEX-Emu/FEX.git fex

      - name: Configure FEX (x86 host debug)
        run: |
          cd fex
          mkdir Build && cd Build
          export CC=clang-17
          export CXX=clang++-17
          export LD=ld.lld-17
          cmake \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=True \
            -DENABLE_ASSERTIONS=False \
            -DBUILD_TESTING=True \
            -DBUILD_THUNKS=True \
            -DBUILD_FEXCONFIG=False \
            -DENABLE_CCACHE=True \
            -DENABLE_X86_HOST_DEBUG=True \
            -G Ninja \
            ..

      - name: Build FEX
        run: |
          cd fex/Build
          ninja -j$(nproc)

      - name: Package as Winlator .tzst
        run: |
          STAGE="fex-stage"
          mkdir -p "$STAGE/usr/bin" "$STAGE/usr/lib"

          cd fex/Build
          DESTDIR=$(pwd)/../../fex-install ninja install
          cd ../..

          cp fex-install/usr/bin/FEX* "$STAGE/usr/bin/" 2>/dev/null || true
          cp fex-install/usr/lib/libFEXCore* "$STAGE/usr/lib/" 2>/dev/null || true
          cp fex-install/usr/lib/FEXCore/* "$STAGE/usr/lib/" 2>/dev/null || true

          FEX_VER=$(cd fex && git describe --tags --always 2>/dev/null || echo "FEX-2507")

          cat > "$STAGE/profile.json" << PROFILE
          {
            "type": "FEXCore",
            "versionName": "${FEX_VER}",
            "versionCode": 0,
            "description": "FEX ${FEX_VER} - x86 emulation for Helio G99 ARM64",
            "files": [
              {"source": "usr/bin/FEXLoader", "target": "\${bindir}/FEXLoader"},
              {"source": "usr/bin/FEXInterpreter", "target": "\${bindir}/FEXInterpreter"},
              {"source": "usr/lib/libFEXCore.so", "target": "\${libdir}/libFEXCore.so"}
            ]
          }
          PROFILE

          cd "$STAGE"
          tar -cf ../fex-helio-g99.tar . --sort=name
          cd ..
          mkdir -p "$OUTPUT_DIR"
          zstd --ultra -22 fex-helio-g99.tar -o "$OUTPUT_DIR/fex-${FEX_VER}-helio-g99.tzst"
          rm -f fex-helio-g99.tar

      - name: Upload Winlator addon
        uses: actions/upload-artifact@v4
        with:
          name: FEXCore-HelioG99-Winlator
          path: ${{ env.OUTPUT_DIR }}/*.tzst
          retention-days: 30
