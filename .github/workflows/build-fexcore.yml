name: Build FEXCore (Winlator - Helio G99)

on:
  workflow_dispatch:

env:
  OUTPUT_DIR: 'fex-output'

jobs:
  build-fexcore:
    name: FEXCore 2507 (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Setup gh + git auth
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gh
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build pkgconf ccache \
            clang-17 llvm-17 lld-17 zstd \
            libssl-dev python3-setuptools libclang-17-dev \
            libcurl4-openssl-dev libgl-dev libglx-dev libegl-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev \
            libc6-dev libgcc-14-dev libstdc++-14-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross libgcc-14-dev-arm64-cross \
            libstdc++-14-dev-arm64-cross

      - name: Clone FEX
        run: |
          git clone --recurse-submodules --branch FEX-2507 \
            --depth 1 https://github.com/FEX-Emu/FEX.git fex || \
          git clone --recurse-submodules --depth 1 \
            https://github.com/FEX-Emu/FEX.git fex

      - name: Setup cross-compile wrappers
        run: |
          mkdir -p /tmp/clang-cross
          printf '#!/bin/bash\nexec clang-17 --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu "$@"\n' > /tmp/clang-cross/aarch64-clang
          printf '#!/bin/bash\nexec clang++-17 --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu "$@"\n' > /tmp/clang-cross/aarch64-clang++
          chmod +x /tmp/clang-cross/aarch64-clang /tmp/clang-cross/aarch64-clang++

      - name: Configure FEX (ARM64 cross-compile)
        run: |
          export PATH="/tmp/clang-cross:$PATH"
          cd fex
          mkdir Build && cd Build
          cat > ../toolchain-aarch64.cmake << 'CTEOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-clang)
          set(CMAKE_CXX_COMPILER aarch64-clang++)
          set(CMAKE_ASM_COMPILER aarch64-clang)
          set(CMAKE_AR llvm-ar-17)
          set(CMAKE_RANLIB llvm-ranlib-17)
          set(CMAKE_LINKER lld-17)
          set(CMAKE_C_FLAGS_INIT "-fuse-ld=lld-17")
          set(CMAKE_CXX_FLAGS_INIT "-fuse-ld=lld-17")
          CTEOF
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=../toolchain-aarch64.cmake \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_LTO=True \
            -DENABLE_ASSERTIONS=False \
            -DBUILD_TESTING=False \
            -DBUILD_THUNKS=False \
            -DBUILD_FEXCONFIG=False \
            -DENABLE_CCACHE=True \
            -G Ninja \
            ..

      - name: Build FEX
        run: |
          cd fex/Build
          ninja -j$(nproc)

      - name: Package as Winlator .tzst
        run: |
          STAGE="fex-stage"
          mkdir -p "$STAGE/usr/bin" "$STAGE/usr/lib"

          cd fex/Build
          DESTDIR=$(pwd)/../../fex-install ninja install
          cd ../..

          cp fex-install/usr/bin/FEX* "$STAGE/usr/bin/" 2>/dev/null || true
          cp fex-install/usr/lib/libFEXCore* "$STAGE/usr/lib/" 2>/dev/null || true
          cp fex-install/usr/lib/FEXCore/* "$STAGE/usr/lib/" 2>/dev/null || true

          FEX_VER=$(cd fex && git describe --tags --always 2>/dev/null || echo "FEX-2507")

          cat > "$STAGE/profile.json" << PROFILE
          {
            "type": "FEXCore",
            "versionName": "${FEX_VER}",
            "versionCode": 0,
            "description": "FEX ${FEX_VER} - x86 emulation for Helio G99 ARM64",
            "files": [
              {"source": "usr/bin/FEXLoader", "target": "\${bindir}/FEXLoader"},
              {"source": "usr/bin/FEXInterpreter", "target": "\${bindir}/FEXInterpreter"},
              {"source": "usr/lib/libFEXCore.so", "target": "\${libdir}/libFEXCore.so"}
            ]
          }
          PROFILE

          cd "$STAGE"
          tar -cf ../fex-helio-g99.tar . --sort=name
          cd ..
          mkdir -p "$OUTPUT_DIR"
          zstd --ultra -22 fex-helio-g99.tar -o "$OUTPUT_DIR/fex-${FEX_VER}-helio-g99.tzst"
          rm -f fex-helio-g99.tar

      - name: Upload Winlator addon
        uses: actions/upload-artifact@v4
        with:
          name: FEXCore-HelioG99-Winlator
          path: ${{ env.OUTPUT_DIR }}/*.tzst
          retention-days: 30
