name: Build FEXCore (Winlator - Helio G99 ARM64)

on:
  workflow_dispatch:
    inputs:
      fex_version:
        description: 'FEX version (e.g., FEX-2507)'
        required: false
        default: 'FEX-2507'
        type: string
      enable_thunks:
        description: 'Build Vulkan/GL thunks'
        required: false
        default: true
        type: boolean
      enable_lto:
        description: 'Enable LTO'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'fex-*'

env:
  FEX_REPO: 'https://github.com/FEX-Emu/FEX.git'
  OUTPUT_DIR: 'fex-output'

jobs:
  build-fexcore:
    name: FEXCore (ARM64 - Helio G99)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Setup gh + git auth
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gh
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build pkgconf ccache \
            clang-17 llvm-17 lld-17 zstd \
            libssl-dev python3-setuptools libclang-17-dev \
            libcurl4-openssl-dev libgl-dev libglx-dev libegl-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxfixes-dev \
            libwayland-dev wayland-protocols nasm \
            libc6-dev libgcc-14-dev libstdc++-14-dev

      - name: Clone FEX
        run: |
          git clone --recurse-submodules --branch ${{ inputs.fex_version }} \
            --depth 1 ${{ env.FEX_REPO }} fex || \
          git clone --recurse-submodules --depth 1 ${{ env.FEX_REPO }} fex
          cd fex
          echo "## FEX Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ inputs.fex_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $(git log --oneline -1)" >> $GITHUB_STEP_SUMMARY

      - name: Configure FEX (x86 host debug)
        run: |
          cd fex
          mkdir Build && cd Build
          CC=clang-17 CXX=clang++-17 cmake \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_LINKER=lld \
            -DENABLE_LTO=${{ inputs.enable_lto && 'True' || 'False' }} \
            -DENABLE_ASSERTIONS=False \
            -DBUILD_TESTING=True \
            -DBUILD_THUNKS=${{ inputs.enable_thunks && 'True' || 'False' }} \
            -DBUILD_FEXCONFIG=False \
            -DENABLE_CCACHE=True \
            -DENABLE_X86_HOST_DEBUG=True \
            -G Ninja \
            ..

      - name: Build FEX
        run: |
          cd fex/Build
          ninja -j$(nproc)

      - name: Package as Winlator .tzst
        run: |
          STAGE="fex-stage"
          mkdir -p "$STAGE/usr/bin" "$STAGE/usr/lib" "$STAGE/etc/FEXCore"

          cd fex/Build
          DESTDIR=$(pwd)/../../fex-install ninja install
          cd ../..

          cp fex-install/usr/bin/FEX* "$STAGE/usr/bin/" 2>/dev/null || true
          cp fex-install/usr/lib/libFEXCore* "$STAGE/usr/lib/" 2>/dev/null || true
          cp fex-install/usr/lib/FEXCore/* "$STAGE/usr/lib/" 2>/dev/null || true

          FEX_VER="${{ inputs.fex_version }}"

          cat > "$STAGE/profile.json" << 'EOF'
          {
            "type": "FEXCore",
            "versionName": "FEX-helio-g99",
            "versionCode": 0,
            "description": "FEX-Emu for Helio G99. x86 emulation on ARM64 with Vulkan/GL thunks.",
            "files": [
              {"source": "usr/bin/FEXLoader", "target": "${bindir}/FEXLoader"},
              {"source": "usr/bin/FEXInterpreter", "target": "${bindir}/FEXInterpreter"},
              {"source": "usr/lib/libFEXCore.so", "target": "${libdir}/libFEXCore.so"}
            ]
          }
          EOF

          cd "$STAGE"
          tar -cf ../fex-helio-g99.tar . --sort=name
          cd ..
          mkdir -p "${{ env.OUTPUT_DIR }}"
          zstd --ultra -22 fex-helio-g99.tar -o "${{ env.OUTPUT_DIR }}/fex-${FEX_VER}-helio-g99.tzst"
          rm -f fex-helio-g99.tar

          echo "### Output:" >> $GITHUB_STEP_SUMMARY
          ls -lh ${{ env.OUTPUT_DIR }}/ >> $GITHUB_STEP_SUMMARY

      - name: Upload Winlator addon
        uses: actions/upload-artifact@v4
        with:
          name: FEXCore-HelioG99-Winlator
          path: ${{ env.OUTPUT_DIR }}/*.tzst
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_DIR }}/*.tzst
          generate_release_notes: true
          name: "FEXCore ${{ inputs.fex_version }} - Helio G99"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
