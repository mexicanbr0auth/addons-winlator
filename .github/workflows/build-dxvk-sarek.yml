name: "Build DXVK-Sarek (Winlator - Mali G57)"

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (all/one)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - balanced
          - performance
          - compatibility
          - dyasync
          - tiler
  push:
    tags:
      - 'dxvk-sarek-*'

env:
  DXVK_SAREK_REPO: 'https://github.com/pythonlover02/DXVK-Sarek.git'
  OUTPUT_DIR: 'dxvk-sarek-output'

jobs:
  build-dxvk-sarek:
    name: "DXVK-Sarek ${{ matrix.variant }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: ${{ inputs.variant == 'all' || github.event_name == 'push' || github.event_name == 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: balanced
            tag: "sarek-balanced"
            desc: "Balanced - Vulkan 1.1/1.2 optimized for Mali G57"
          - variant: performance
            tag: "sarek-performance"
            desc: "Performance - Max FPS for Mali G57"
          - variant: compatibility
            tag: "sarek-compatibility"
            desc: "Compatibility - Fix graphical glitches"
          - variant: dyasync
            tag: "sarek-dyasync"
            desc: "DyAsync - Dynamic async shader compilation"
          - variant: tiler
            tag: "sarek-tiler"
            desc: "Tiler - Tile-based rendering optimized"

    steps:
      - name: Setup gh + git auth
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gh
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gcc-mingw-w64 g++-mingw-w64 \
            glslang-tools libvulkan-dev spirv-tools spirv-headers \
            git python3 python3-mako cmake zstd \
            gcc-multilib g++-multilib
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: Clone DXVK-Sarek
        run: |
          git clone --recursive --branch main \
            --depth 1 ${{ env.DXVK_SAREK_REPO }} dxvk-sarek
          cd dxvk-sarek
          echo "## DXVK-Sarek ${{ matrix.variant }} Build" >> $GITHUB_STEP_SUMMARY
          echo "- Variant: ${{ matrix.variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $(git log --oneline -1)" >> $GITHUB_STEP_SUMMARY

      - name: Fix DXVK-Sarek compile error (std::sqrtf)
        run: |
          cd dxvk-sarek
          find src/ -name "*.h" -o -name "*.cpp" | xargs sed -i 's/std::sqrtf/std::sqrt/g' 2>/dev/null || true

      - name: Build 64-bit DXVK-Sarek
        run: |
          cd dxvk-sarek
          meson setup build.w64 \
            --cross-file build-win64.txt \
            --buildtype release \
            --strip \
            --prefix $(pwd)/../build-install/x64 \
            --bindir bin \
            --libdir bin \
            -Db_ndebug=if-release
          ninja -C build.w64 -j$(nproc)
          ninja -C build.w64 install

      - name: Build 32-bit DXVK-Sarek
        run: |
          cd dxvk-sarek
          meson setup build.w32 \
            --cross-file build-win32.txt \
            --buildtype release \
            --strip \
            --prefix $(pwd)/../build-install/x32 \
            --bindir bin \
            --libdir bin \
            -Db_ndebug=if-release
          ninja -C build.w32 -j$(nproc)
          ninja -C build.w32 install

      - name: Package as Winlator .wcp
        run: |
          STAGE="dxvk-sarek-stage"
          mkdir -p "$STAGE/system32" "$STAGE/syswow64"

          cp build-install/x64/bin/*.dll "$STAGE/system32/" 2>/dev/null || true
          cp build-install/x32/bin/*.dll "$STAGE/syswow64/" 2>/dev/null || true

          cd dxvk-sarek
          SAREK_VER=$(git describe --tags --always 2>/dev/null || echo "main")
          cd ..

          DXVK_VER="sarek-${SAREK_VER}-${{ matrix.tag }}"

          cat > "$STAGE/profile.json" << 'EOF'
          {
            "type": "DXVK",
            "versionName": "PLACEHOLDER_VER-mali-g57",
            "versionCode": 0,
            "description": "${PLACEHOLDER_DESC}",
            "files": [
              {"source": "system32/d3d8.dll", "target": "${system32}/d3d8.dll"},
              {"source": "system32/d3d9.dll", "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll", "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll", "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll", "target": "${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll", "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll", "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll", "target": "${syswow64}/dxgi.dll"}
            ]
          }
          EOF
          sed -i "s/PLACEHOLDER_VER/${DXVK_VER}/" "$STAGE/profile.json"
          sed -i "s/\${PLACEHOLDER_DESC}/${{ matrix.desc }}/g" "$STAGE/profile.json"

          case "${{ matrix.variant }}" in
            balanced)
              cat > "$STAGE/dxvk.conf" << 'DXEOF'
              dxvk.shaderCompilationMethod = dyasync
              dxvk.enableStateCache = True
              dxvk.numCompilerThreads = 0
              dxvk.framePace = low-latency
              dxvk.maxFrameLatency = 1
              dxvk.numAsyncThreads = 2
              d3d11.cachedDynamicResources = Memory
              d3d11.enableDeferredContexts = False
              d3d11.syncInterval = 0
              d3d9.floatEmulation = Strict
              d3d9.presentInterval = 0
              d3d9.allowDoNotWait = True
              d3d9.enableDialogMode = True
              d3d8.batching = True
              DXEOF
              ;;
            performance)
              cat > "$STAGE/dxvk.conf" << 'DXEOF'
              dxvk.shaderCompilationMethod = dyasync
              dxvk.enableStateCache = True
              dxvk.numCompilerThreads = 0
              dxvk.framePace = flow
              dxvk.maxFrameLatency = 0
              dxvk.numAsyncThreads = 4
              d3d11.cachedDynamicResources = Memory
              d3d11.enableDeferredContexts = False
              d3d11.syncInterval = 0
              d3d11.disableMsaa = True
              d3d11.forceTightFrustum = True
              d3d9.floatEmulation = Strict
              d3d9.presentInterval = 0
              d3d9.allowDoNotWait = True
              d3d9.enableDialogMode = True
              d3d9.fastAssert = True
              d3d8.batching = True
              DXEOF
              ;;
            compatibility)
              cat > "$STAGE/dxvk.conf" << 'DXEOF'
              dxvk.shaderCompilationMethod = dyasync
              dxvk.enableStateCache = True
              dxvk.numCompilerThreads = 0
              dxvk.framePace = low-latency
              dxvk.maxFrameLatency = 2
              dxvk.numAsyncThreads = 1
              d3d11.cachedDynamicResources = Memory
              d3d11.enableDeferredContexts = False
              d3d11.syncInterval = 0
              d3d9.floatEmulation = True
              d3d9.presentInterval = 0
              d3d9.allowDoNotWait = True
              d3d9.enableDialogMode = True
              d3d8.batching = True
              DXEOF
              ;;
            dyasync)
              cat > "$STAGE/dxvk.conf" << 'DXEOF'
              dxvk.shaderCompilationMethod = dyasync
              dxvk.enableStateCache = True
              dxvk.numCompilerThreads = 0
              dxvk.framePace = low-latency
              dxvk.maxFrameLatency = 1
              dxvk.numAsyncThreads = 3
              d3d11.cachedDynamicResources = Memory
              d3d11.enableDeferredContexts = False
              d3d11.syncInterval = 0
              d3d9.floatEmulation = Strict
              d3d9.presentInterval = 0
              d3d9.allowDoNotWait = True
              d3d9.enableDialogMode = True
              d3d8.batching = True
              DXEOF
              ;;
            tiler)
              cat > "$STAGE/dxvk.conf" << 'DXEOF'
              dxvk.shaderCompilationMethod = dyasync
              dxvk.enableStateCache = True
              dxvk.numCompilerThreads = 0
              dxvk.framePace = low-latency
              dxvk.maxFrameLatency = 1
              dxvk.numAsyncThreads = 2
              dxvk.tilerMode = batch
              d3d11.cachedDynamicResources = Memory
              d3d11.enableDeferredContexts = False
              d3d11.syncInterval = 0
              d3d11.preferRawDepthStencil = True
              d3d9.floatEmulation = Strict
              d3d9.presentInterval = 0
              d3d9.allowDoNotWait = True
              d3d9.enableDialogMode = True
              d3d8.batching = True
              DXEOF
              ;;
          esac

          cd "$STAGE"
          tar -cf ../sarek-mali-g57.tar . --sort=name
          cd ..
          mkdir -p "${{ env.OUTPUT_DIR }}"
          zstd --ultra -22 sarek-mali-g57.tar -o "${{ env.OUTPUT_DIR }}/dxvk-sarek-${DXVK_VER}-mali-g57.wcp"
          rm -f sarek-mali-g57.tar

          echo "### Output:" >> $GITHUB_STEP_SUMMARY
          ls -lh ${{ env.OUTPUT_DIR }}/ >> $GITHUB_STEP_SUMMARY

      - name: Upload Winlator addon
        uses: actions/upload-artifact@v4
        with:
          name: "DXVK-Sarek-${{ matrix.variant }}-MaliG57"
          path: ${{ env.OUTPUT_DIR }}/*.wcp
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_DIR }}/*.wcp
          generate_release_notes: true
          name: "DXVK-Sarek ${{ matrix.variant }} - Mali G57"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
