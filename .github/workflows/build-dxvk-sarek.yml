name: Build DXVK-Sarek (Winlator - Mali G57)

on:
  workflow_dispatch:

env:
  OUTPUT_DIR: 'dxvk-sarek-output'

jobs:
  build-dxvk-sarek:
    name: DXVK-Sarek (Vulkan 1.1/1.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Setup gh + git auth
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gh
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gcc-mingw-w64 g++-mingw-w64 \
            glslang-tools libvulkan-dev spirv-tools spirv-headers \
            git python3 python3-mako cmake zstd \
            gcc-multilib g++-multilib
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: Clone DXVK-Sarek
        run: |
          git clone --recursive --branch main --depth 1 \
            https://github.com/pythonlover02/DXVK-Sarek.git dxvk-sarek
          cd dxvk-sarek
          find src/ -name "*.h" -o -name "*.cpp" | xargs sed -i 's/std::sqrtf/std::sqrt/g' 2>/dev/null || true

      - name: Build 64-bit DXVK-Sarek
        run: |
          cd dxvk-sarek
          meson setup build.w64 \
            --cross-file build-win64.txt \
            --buildtype release --strip \
            --prefix $(pwd)/../build-install/x64 \
            --bindir bin --libdir bin \
            -Db_ndebug=if-release
          ninja -C build.w64 -j$(nproc)
          ninja -C build.w64 install

      - name: Build 32-bit DXVK-Sarek
        run: |
          cd dxvk-sarek
          meson setup build.w32 \
            --cross-file build-win32.txt \
            --buildtype release --strip \
            --prefix $(pwd)/../build-install/x32 \
            --bindir bin --libdir bin \
            -Db_ndebug=if-release
          ninja -C build.w32 -j$(nproc)
          ninja -C build.w32 install

      - name: Package as Winlator .wcp
        run: |
          STAGE="dxvk-sarek-stage"
          mkdir -p "$STAGE/system32" "$STAGE/syswow64"
          cp build-install/x64/bin/*.dll "$STAGE/system32/" 2>/dev/null || true
          cp build-install/x32/bin/*.dll "$STAGE/syswow64/" 2>/dev/null || true

          cd dxvk-sarek
          SAREK_VER=$(git describe --tags --always 2>/dev/null || echo "main")
          cd ..

          cat > "$STAGE/profile.json" << PROFILE
          {
            "type": "DXVK",
            "versionName": "sarek-${SAREK_VER}-mali-g57",
            "versionCode": 0,
            "description": "DXVK-Sarek ${SAREK_VER} - Mali G57 MC2 / Helio G99",
            "files": [
              {"source": "system32/d3d8.dll", "target": "\${system32}/d3d8.dll"},
              {"source": "system32/d3d9.dll", "target": "\${system32}/d3d9.dll"},
              {"source": "system32/d3d10core.dll", "target": "\${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll", "target": "\${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll", "target": "\${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll", "target": "\${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll", "target": "\${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "\${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll", "target": "\${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll", "target": "\${syswow64}/dxgi.dll"}
            ]
          }
          PROFILE

          cat > "$STAGE/dxvk.conf" << 'DXEOF'
          dxvk.shaderCompilationMethod = dyasync
          dxvk.enableStateCache = True
          dxvk.numCompilerThreads = 0
          dxvk.numAsyncThreads = 2
          dxvk.framePace = low-latency
          dxvk.maxFrameLatency = 1
          dxvk.tilerMode = batch
          d3d11.cachedDynamicResources = Memory
          d3d11.enableDeferredContexts = False
          d3d11.syncInterval = 0
          d3d9.presentInterval = 0
          d3d9.floatEmulation = Strict
          d3d9.allowDoNotWait = True
          d3d9.enableDialogMode = True
          d3d8.batching = True
          DXEOF

          cd "$STAGE"
          tar -cf ../sarek-mali-g57.tar . --sort=name
          cd ..
          mkdir -p "$OUTPUT_DIR"
          zstd --ultra -22 sarek-mali-g57.tar -o "$OUTPUT_DIR/dxvk-sarek-${SAREK_VER}-mali-g57.wcp"
          rm -f sarek-mali-g57.tar

      - name: Upload Winlator addon
        uses: actions/upload-artifact@v4
        with:
          name: DXVK-Sarek-MaliG57-Winlator
          path: ${{ env.OUTPUT_DIR }}/*.wcp
          retention-days: 30
