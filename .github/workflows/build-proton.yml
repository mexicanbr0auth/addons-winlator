name: Build Proton (Winlator - Mali G57 / Helio G99)

on:
  workflow_dispatch:
    inputs:
      use_gplall:
        description: 'Use DXVK-GPLALL (async)'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'proton-*'

env:
  DXVK_REPO: 'https://github.com/doitsujin/dxvk.git'
  DXVK_GPLALL_REPO: 'https://github.com/Digger1955/dxvk-gplall.git'
  OUTPUT_DIR: 'proton-output'

jobs:
  build-proton:
    name: Proton DXVK (Mali G57)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Setup gh + git auth
        run: |
          sudo apt-get update -qq && sudo apt-get install -y gh
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gcc-mingw-w64 g++-mingw-w64 \
            glslang-tools libvulkan-dev spirv-tools spirv-headers \
            git python3 python3-mako cmake zstd \
            gcc-multilib g++-multilib
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - name: Clone DXVK
        run: |
          if [ "${{ inputs.use_gplall }}" = "true" ]; then
            git clone --recursive --branch GPLALL-master-2.6.8 \
              ${{ env.DXVK_GPLALL_REPO }} dxvk
          else
            git clone --recursive --branch dxvk-2.6.1 \
              ${{ env.DXVK_REPO }} dxvk
          fi
          cd dxvk
          echo "## Proton DXVK Build" >> $GITHUB_STEP_SUMMARY
          echo "- Source: $(git remote get-url origin)" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $(git branch --show-current)" >> $GITHUB_STEP_SUMMARY

      - name: Build 64-bit
        run: |
          cd dxvk
          meson setup build.w64 \
            --cross-file build-win64.txt \
            --buildtype release \
            --strip \
            --prefix $(pwd)/../build-install/x64 \
            --bindir bin --libdir bin \
            -Db_ndebug=if-release \
            -Denable_d3d8=true -Denable_d3d9=true \
            -Denable_d3d10=true -Denable_d3d11=true \
            -Denable_dxgi=true
          ninja -C build.w64 -j$(nproc)
          ninja -C build.w64 install

      - name: Build 32-bit
        run: |
          cd dxvk
          meson setup build.w32 \
            --cross-file build-win32.txt \
            --buildtype release \
            --strip \
            --prefix $(pwd)/../build-install/x32 \
            --bindir bin --libdir bin \
            -Db_ndebug=if-release \
            -Denable_d3d8=true -Denable_d3d9=true \
            -Denable_d3d10=true -Denable_d3d11=true \
            -Denable_dxgi=true
          ninja -C build.w32 -j$(nproc)
          ninja -C build.w32 install

      - name: Package as Winlator .wcp
        run: |
          STAGE="proton-dxvk-stage"
          mkdir -p "$STAGE/system32" "$STAGE/syswow64"

          cp build-install/x64/bin/*.dll "$STAGE/system32/" 2>/dev/null || true
          cp build-install/x32/bin/*.dll "$STAGE/syswow64/" 2>/dev/null || true

          DXVK_VER="proton-gplall-2.6.8"
          if [ "${{ inputs.use_gplall }}" != "true" ]; then
            DXVK_VER="proton-dxvk-2.6.1"
          fi

          cat > "$STAGE/profile.json" << 'EOF'
          {
            "type": "DXVK",
            "versionName": "PLACEHOLDER_VER-mali-g57",
            "versionCode": 0,
            "description": "Proton DXVK for Mali G57 MC2 + Helio G99. Async, tiler batch, low-latency.",
            "files": [
              {"source": "system32/d3d8.dll", "target": "${system32}/d3d8.dll"},
              {"source": "system32/d3d9.dll", "target": "${system32}/d3d9.dll"},
              {"source": "system32/d3d10.dll", "target": "${system32}/d3d10.dll"},
              {"source": "system32/d3d10_1.dll", "target": "${system32}/d3d10_1.dll"},
              {"source": "system32/d3d10core.dll", "target": "${system32}/d3d10core.dll"},
              {"source": "system32/d3d11.dll", "target": "${system32}/d3d11.dll"},
              {"source": "system32/dxgi.dll", "target": "${system32}/dxgi.dll"},
              {"source": "syswow64/d3d8.dll", "target": "${syswow64}/d3d8.dll"},
              {"source": "syswow64/d3d9.dll", "target": "${syswow64}/d3d9.dll"},
              {"source": "syswow64/d3d10.dll", "target": "${syswow64}/d3d10.dll"},
              {"source": "syswow64/d3d10_1.dll", "target": "${syswow64}/d3d10_1.dll"},
              {"source": "syswow64/d3d10core.dll", "target": "${syswow64}/d3d10core.dll"},
              {"source": "syswow64/d3d11.dll", "target": "${syswow64}/d3d11.dll"},
              {"source": "syswow64/dxgi.dll", "target": "${syswow64}/dxgi.dll"}
            ]
          }
          EOF
          sed -i "s/PLACEHOLDER_VER/${DXVK_VER}/" "$STAGE/profile.json"

          cat > "$STAGE/dxvk.conf" << 'DXEOF'
          dxvk.enableAsync = True
          dxvk.enableGraphicsPipelineLibrary = False
          dxvk.enableStateCache = True
          dxvk.numCompilerThreads = 0
          dxvk.framePace = low-latency
          dxvk.maxFrameLatency = 1
          dxvk.tilerMode = batch
          d3d9.floatEmulation = Strict
          DXEOF

          cd "$STAGE"
          tar -cf ../proton-dxvk.tar . --sort=name
          cd ..
          mkdir -p "${{ env.OUTPUT_DIR }}"
          zstd --ultra -22 proton-dxvk.tar -o "${{ env.OUTPUT_DIR }}/proton-dxvk-${DXVK_VER}-mali-g57.wcp"
          rm -f proton-dxvk.tar

          echo "### Output:" >> $GITHUB_STEP_SUMMARY
          ls -lh ${{ env.OUTPUT_DIR }}/ >> $GITHUB_STEP_SUMMARY

      - name: Upload Winlator addon
        uses: actions/upload-artifact@v4
        with:
          name: Proton-DXVK-MaliG57-Winlator
          path: ${{ env.OUTPUT_DIR }}/*.wcp
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_DIR }}/*.wcp
          generate_release_notes: true
          name: "Proton DXVK - Mali G57"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
