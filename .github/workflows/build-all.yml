name: "Build All - Winlator Addons"

on:
  workflow_dispatch:

jobs:
  build-dxvk:
    uses: ./.github/workflows/build-dxvk.yml
    secrets: inherit

  build-dxvk-sarek:
    uses: ./.github/workflows/build-dxvk-sarek.yml
    secrets: inherit

  build-fex:
    uses: ./.github/workflows/build-fexcore.yml
    secrets: inherit

  build-proton:
    uses: ./.github/workflows/build-proton.yml
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs: [build-dxvk, build-dxvk-sarek, build-fex, build-proton]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| DXVK GPLALL 2.6.8 | ${{ needs.build-dxvk.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DXVK-Sarek | ${{ needs.build-dxvk-sarek.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FEXCore 2507 | ${{ needs.build-fex.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Proton GPLALL 2.6.8 | ${{ needs.build-proton.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
