name: "Build All - Winlator Addons (Mali G57 / Helio G99)"

on:
  workflow_dispatch:
    inputs:
      build_dxvk:
        description: 'Build DXVK (all 5 variants)'
        required: false
        default: true
        type: boolean
      build_dxvk_sarek:
        description: 'Build DXVK-Sarek (all 5 variants)'
        required: false
        default: true
        type: boolean
      build_fex:
        description: 'Build FEXCore (all 5 variants)'
        required: false
        default: true
        type: boolean
      build_proton:
        description: 'Build Proton DXVK (all 5 variants)'
        required: false
        default: true
        type: boolean

jobs:
  build-dxvk:
    if: inputs.build_dxvk == true
    uses: ./.github/workflows/build-dxvk.yml
    with:
      variant: all
    secrets: inherit

  build-dxvk-sarek:
    if: inputs.build_dxvk_sarek == true
    uses: ./.github/workflows/build-dxvk-sarek.yml
    with:
      variant: all
    secrets: inherit

  build-fex:
    if: inputs.build_fex == true
    uses: ./.github/workflows/build-fexcore.yml
    with:
      variant: all
    secrets: inherit

  build-proton:
    if: inputs.build_proton == true
    uses: ./.github/workflows/build-proton.yml
    with:
      variant: all
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs: [build-dxvk, build-dxvk-sarek, build-fex, build-proton]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| DXVK (5 variants) | ${{ needs.build-dxvk.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DXVK-Sarek (5 variants) | ${{ needs.build-dxvk-sarek.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FEXCore (5 variants) | ${{ needs.build-fex.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Proton (5 variants) | ${{ needs.build-proton.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
