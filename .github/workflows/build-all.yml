name: "Build All - Winlator Addons (Mali G57 / Helio G99)"

on:
  workflow_dispatch:
    inputs:
      build_dxvk:
        description: 'Build DXVK (GPLALL)'
        required: false
        default: true
        type: boolean
      build_dxvk_sarek:
        description: 'Build DXVK-Sarek'
        required: false
        default: true
        type: boolean
      build_fex:
        description: 'Build FEXCore'
        required: false
        default: true
        type: boolean
      build_proton:
        description: 'Build Proton DXVK'
        required: false
        default: false
        type: boolean

jobs:
  build-dxvk:
    if: inputs.build_dxvk == true
    uses: ./.github/workflows/build-dxvk.yml
    with:
      enable_async: true
      build_32bit: true
      build_64bit: true
    secrets: inherit

  build-dxvk-sarek:
    if: inputs.build_dxvk_sarek == true
    uses: ./.github/workflows/build-dxvk-sarek.yml
    with:
      build_32bit: true
      build_64bit: true
    secrets: inherit

  build-fex:
    if: inputs.build_fex == true
    uses: ./.github/workflows/build-fexcore.yml
    with:
      enable_thunks: true
      enable_lto: true
    secrets: inherit

  build-proton:
    if: inputs.build_proton == true
    uses: ./.github/workflows/build-proton.yml
    with:
      use_gplall: true
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs: [build-dxvk, build-dxvk-sarek, build-fex, build-proton]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "# Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| DXVK | ${{ needs.build-dxvk.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DXVK-Sarek | ${{ needs.build-dxvk-sarek.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| FEXCore | ${{ needs.build-fex.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Proton | ${{ needs.build-proton.result || 'skipped' }} |" >> $GITHUB_STEP_SUMMARY
